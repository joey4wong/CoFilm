name: Update ratings
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: ratings
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node scripts/ratings.mjs
        env:
          OD_LINK: ${{ secrets.OD_LINK }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Commit
        run: |
          git config user.name "cofilm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ratings.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Update ratings"
          # Site commits may land while the job runs. Only this bot edits the ratings file, so rebasing is safe.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not push the updated ratings after 4 attempts" >&2
          exit 1
