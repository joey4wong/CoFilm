name: Update ratings
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ratings
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ratings.test.mjs
      - run: node scripts/ratings.mjs
        env:
          OD_LINK: ${{ secrets.OD_LINK }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Commit
        run: |
          git config user.name "cofilm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ratings.enc.json
          git diff --cached --quiet || (git commit -m "Update ratings" && git push)
