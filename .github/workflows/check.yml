name: Check website
on:
  push:
    paths:
      - '**.js'
      - '**.mjs'
      - '**.css'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
