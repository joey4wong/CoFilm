<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>CoFilm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='white' d='M8 5v14l11-7z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
<script type="module" src="https://cdn.jsdelivr.net/npm/movi-player/dist/element.js"></script>
</head>
<body>
<div id="ambient"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-lens" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feImage href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20preserveAspectRatio%3D%22none%22%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231a0000%22/%3E%3Cstop%20offset%3D%22.07%22%20stop-color%3D%22%23800000%22/%3E%3Cstop%20offset%3D%22.93%22%20stop-color%3D%22%23800000%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e60000%22/%3E%3C/linearGradient%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="h"/>
    <feImage href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20preserveAspectRatio%3D%22none%22%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23001a00%22/%3E%3Cstop%20offset%3D%22.07%22%20stop-color%3D%22%23008000%22/%3E%3Cstop%20offset%3D%22.93%22%20stop-color%3D%22%23008000%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2300e600%22/%3E%3C/linearGradient%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="v"/>
    <feComposite in="h" in2="v" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="map"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="0.06" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script>if (navigator.userAgentData && navigator.userAgentData.brands.some(b => /Chromium/.test(b.brand))) document.documentElement.classList.add('chromium');</script>
<nav id="nav" class="lg" aria-label="Main">
  <a href="#/" data-route="home">Home</a>
  <a href="#/movies" data-route="movies">Movies</a>
  <a href="#/shows" data-route="shows">Shows</a>
  <a href="#/genres" data-route="genres">Genres</a>
  <span class="sep"></span>
  <button id="searchBtn" class="icon" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button id="refresh" class="icon" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button id="settingsBtn" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</nav>

<main id="view"></main>
<div id="toast" hidden></div>

<div id="search" class="overlay" hidden>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Search titles, actors, directors…" autocomplete="off">
    <button class="icon" data-close-search aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="results" class="grid"></div>
</div>

<div id="player" class="overlay" hidden>
  <div class="ptop"><span id="ptitle"></span><button id="pclose" class="pill ghost">Close</button></div>
  <div id="pwrap"></div>
</div>

<div id="setup" class="overlay" hidden>
  <div class="box">
    <h2>Settings</h2>
    <p>Paste the view-only OneDrive share link of your movie folder. It is saved only in this browser on this device and is never uploaded anywhere.</p>
    <input id="linkInput" type="url" placeholder="https://1drv.ms/f/c/...">
    <p class="small" style="margin:0">TMDB API key (optional: better matching, cast photos)</p>
    <input id="tmdbInput" type="text" placeholder="32-character API key" autocomplete="off">
    <div class="actions"><button id="saveLink" class="pill">Save &amp; load</button><button id="cancelSetup" class="pill ghost">Cancel</button></div>
    <button id="clearCache" class="pill ghost small">Clear metadata cache</button>
  </div>
</div>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
