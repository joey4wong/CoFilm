<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoFilm">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="theme.js?v=120"></script>
<title>CoFilm</title>
<link rel="icon" href="favicon.ico?v=120" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=120">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=120">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=120">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="modulepreload" href="lib/catalog.mjs?v=120">
<link rel="preconnect" href="https://api-badgerp.svc.ms" crossorigin>
<link rel="preconnect" href="https://my.microsoftpersonalcontent.com" crossorigin>
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
</head>
<body>
<div id="ambient" aria-hidden="true"><div class="amb"></div><div class="amb"></div></div>
<script>if (navigator.userAgentData && navigator.userAgentData.brands.some(b => /Chromium/.test(b.brand))) document.documentElement.classList.add('chromium');</script>
<nav id="nav" class="lg" aria-label="Main">
  <a href="#/" data-route="home">Home</a>
  <a href="#/movies" data-route="movies">Movies</a>
  <a href="#/shows" data-route="shows">Shows</a>
  <a href="#search" id="searchLink" class="searchlink" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></a>
</nav>

<main id="view"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<div id="search" class="overlay" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="searchbox">
    <div class="searchfield lg"><input id="q" aria-label="Search the library" type="search" autocomplete="off"></div>
    <button class="icon lg" data-close-search aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="results" class="grid"></div>
</div>

<div id="trailer" class="trailer-modal" role="dialog" aria-modal="true" aria-label="Trailer" hidden>
  <div class="trailer-box">
    <button class="pclose lg trailer-close" type="button" data-trailer-close aria-label="Close trailer" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="trailer-frame"></div>
  </div>
</div>

<div id="player" class="overlay" role="dialog" aria-modal="true" aria-label="Video player" hidden>
  <div class="ptop"><span id="ptitle"></span><button id="pclose" class="pclose lg" type="button" aria-label="Close player" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="pwrap"></div>
</div>

<div id="setup" class="overlay" role="dialog" aria-modal="true" aria-label="Welcome to CoFilm" hidden>
  <div class="box">
    <h2>Welcome to CoFilm</h2>
    <p>Enter your access code to start watching.</p>
    <input id="codeInput" aria-label="Access code" type="text" placeholder="xxxx-xxxx" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:20px;letter-spacing:.12em;text-align:center">
    <div class="actions"><button id="unlockBtn" class="pill">Unlock</button><button id="cancelSetup" class="pill ghost">Cancel</button></div>
    <p id="codeMsg" role="alert" class="small" style="min-height:1.2em;color:#ff8a80"></p>
    <details class="adv"><summary class="small">Advanced: set up with a OneDrive link</summary>
      <p class="small">Paste the view-only OneDrive share link of the movie folder. It is saved only in this browser.</p>
      <input id="linkInput" aria-label="OneDrive share link" type="url" placeholder="https://1drv.ms/f/c/...">
      <p class="small" style="margin:0">TMDB API key (optional)</p>
      <input id="tmdbInput" aria-label="TMDB API key" type="text" placeholder="32-character API key" autocomplete="off">
      <div class="actions"><button id="saveLink" class="pill small">Save &amp; load</button><button id="clearCache" class="pill ghost small">Clear metadata cache</button></div>
    </details>
  </div>
</div>
<script type="module" src="app.js?v=120"></script>
</body>
</html>
