<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<script src="theme.js?v=46"></script>
<title>CoFilm</title>
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=46">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
<div id="ambient"></div>
<script>if (navigator.userAgentData && navigator.userAgentData.brands.some(b => /Chromium/.test(b.brand))) document.documentElement.classList.add('chromium');</script>
<nav id="nav" class="lg" aria-label="Main">
  <a href="#/" data-route="home">Home</a>
  <a href="#/movies" data-route="movies">Movies</a>
  <a href="#/shows" data-route="shows">Shows</a>
  <a href="#/genres" data-route="genres">Genres</a>
  <a href="#search" id="searchLink" class="searchlink" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></a>
</nav>

<main id="view"></main>
<div id="toast" hidden></div>

<div id="search" class="overlay" hidden>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Search by title, actor, director, genre or year" autocomplete="off">
    <button class="icon" data-close-search aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="results" class="grid"></div>
</div>

<div id="player" class="overlay" hidden>
  <div class="ptop"><span id="ptitle"></span><button id="pclose" class="pill ghost">Close</button></div>
  <div id="pwrap"></div>
</div>

<div id="setup" class="overlay" hidden>
  <div class="box">
    <h2>Welcome to CoFilm</h2>
    <p>Enter your access code to start watching.</p>
    <input id="codeInput" type="text" placeholder="xxxx-xxxx" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:20px;letter-spacing:.12em;text-align:center">
    <div class="actions"><button id="unlockBtn" class="pill">Unlock</button><button id="cancelSetup" class="pill ghost">Cancel</button></div>
    <p id="codeMsg" class="small" style="min-height:1.2em;color:#ff8a80"></p>
    <details class="adv"><summary class="small">Advanced: set up with a OneDrive link</summary>
      <p class="small">Paste the view-only OneDrive share link of the movie folder. It is saved only in this browser.</p>
      <input id="linkInput" type="url" placeholder="https://1drv.ms/f/c/...">
      <p class="small" style="margin:0">TMDB API key (optional)</p>
      <input id="tmdbInput" type="text" placeholder="32-character API key" autocomplete="off">
      <div class="actions"><button id="saveLink" class="pill small">Save &amp; load</button><button id="clearCache" class="pill ghost small">Clear metadata cache</button></div>
    </details>
  </div>
</div>
<script type="module" src="app.js?v=46"></script>
</body>
</html>
